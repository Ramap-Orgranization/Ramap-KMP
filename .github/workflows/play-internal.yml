name: Play internal testing
run-name: Play internal ${{ inputs.tag }} (${{ inputs.version_code }}) ${{ inputs.aab_sha256 }}

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Approved annotated release tag (vX.Y.Z)
                required: true
                type: string
            source_sha:
                description: Approved release commit (full SHA)
                required: true
                type: string
            version_code:
                description: Approved Android versionCode
                required: true
                type: string
            aab_sha256:
                description: SHA-256 of the locally approved AAB
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: play-com-peto-ramap
    cancel-in-progress: false

jobs:
    publish:
        # Execute trusted deployment tooling, never code from a user-supplied tag or SHA.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: play-internal
        permissions:
            contents: read
            id-token: write
        env:
            RELEASE_TAG: ${{ inputs.tag }}
            SOURCE_SHA: ${{ inputs.source_sha }}
            VERSION_CODE: ${{ inputs.version_code }}
            AAB_SHA256: ${{ inputs.aab_sha256 }}
            FASTLANE_SKIP_UPDATE_CHECK: '1'
            FASTLANE_HIDE_CHANGELOG: '1'
            FASTLANE_HIDE_GITHUB_ISSUES: '1'
            FASTLANE_SKIP_DOCS: '1'
            FASTLANE_OPT_OUT_USAGE: '1'
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: '3.12'
            - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
              with:
                  distribution: temurin
                  java-version: '17'
            - name: Verify approved release and AAB
              env:
                  GH_TOKEN: ${{ github.token }}
              run: python3 scripts/play_internal.py --output "$RUNNER_TEMP/play-internal"
            - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
              with:
                  ruby-version: '4.0.0'
                  working-directory: androidApp
                  bundler-cache: true
            - name: Check Play authentication configuration
              env:
                  WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
                  SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
              run: |
                  test -n "$WIF_PROVIDER" || { echo 'Configure PLAY_WIF_PROVIDER in play-internal.'; exit 1; }
                  test -n "$SERVICE_ACCOUNT" || { echo 'Configure PLAY_SERVICE_ACCOUNT in play-internal.'; exit 1; }
            - id: auth
              uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
              with:
                  workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
                  service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
                  create_credentials_file: true
                  export_environment_variables: true
            - name: Publish exact AAB to internal testing
              working-directory: androidApp
              env:
                  VERIFIED_RELEASE: ${{ runner.temp }}/play-internal/verified.json
                  PLAY_RESULT: ${{ runner.temp }}/play-internal/result.json
              run: bundle exec fastlane android internal
            - name: Summarize deployment
              if: always()
              env:
                  DEPLOYMENT_STATUS: ${{ job.status }}
                  PLAY_RESULT: ${{ runner.temp }}/play-internal/result.json
              run: |
                  python3 - <<'PY'
                  import json, os
                  from pathlib import Path
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                      summary.write('## Play internal testing\n\n')
                      summary.write(f"Job: {os.environ['DEPLOYMENT_STATUS']}\n\n")
                      result = Path(os.environ['PLAY_RESULT'])
                      if result.is_file():
                          data = json.loads(result.read_text())
                          for key in ('status', 'tag', 'source_sha', 'version_code', 'sha256', 'release_url'):
                              summary.write(f"- {key}: {data[key]}\n")
                          summary.write('\nInternal track commit verified; tester installation and review availability are separate.\n')
                      else:
                          summary.write('No verified Play result. Inspect the failed step before retrying the same approved artifact.\n')
                  PY
