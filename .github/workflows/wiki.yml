name: LLM Wiki

on:
  pull_request:
  push:
    branches: ["main", "develop", "release", "release/**", "hotfix/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test wiki validator
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate wiki
        run: python3 scripts/check_wiki.py
