name: Android CI

on:
  push:
    branches: [ "main", "develop", "release/**", "hotfix/**" ]
  pull_request:
    branches: [ "main", "develop", "release/**", "hotfix/**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MEDIA_API_URL: ${{ vars.MEDIA_API_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_PRIVATE_BUCKET: ${{ vars.R2_PRIVATE_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      id: java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Locate Gradle cache
      if: steps.java.outputs.cache-hit != 'true'
      id: gradle-cache
      run: echo "home=$HOME/.gradle" >> "$GITHUB_OUTPUT"

    # Reuse resolved artifacts across cache keys when an upstream Maven repository is unavailable.
    - name: Restore recent Gradle cache
      if: steps.java.outputs.cache-hit != 'true'
      uses: actions/cache/restore@v4
      with:
        path: |
          ${{ steps.gradle-cache.outputs.home }}/caches
          ${{ steps.gradle-cache.outputs.home }}/wrapper
        key: setup-java-Linux-x64-gradle-fallback
        restore-keys: setup-java-Linux-x64-gradle-

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint Check
      run: ./gradlew ktlintCheck

    - name: Unit Tests
      run: ./gradlew testAndroidHostTest
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    - name: Build Android App
      run: ./gradlew :androidApp:assembleDebug :androidApp:bundleRelease
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        NAVER_MAP_NCP_KEY_ID: ${{ secrets.NAVER_MAP_NCP_KEY_ID }}
